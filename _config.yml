# Logo (Font Awesome Class, used as fallback / on tag & category pages)
fa_logo: fa-cube

# Logo image (optional, shown on home, about, post & other pages instead of fa_logo. Leave empty to use fa_logo)
logo_img:

# Favicon (optional, path to favicon files in your site's source/ directory)
favicon:
apple_touch_icon:

# Header
menu:
  Home: /
  Archives: /archives
  About: /about/
  Tags: /tags/
  Categories: /categories/
  Contact: /contact/

# Default post title
default_post_title: Untitled

# Archive Date Format
archive_date_format: MMM YYYY

# Comments.
comments:
  # Disqus comments
  disqus_shortname:

# Google Analytics Tracking ID
google_analytics:

# Social Accounts
twitter_url:
facebook_url:
instagram_url:
dribble_url:
github_url:
telegram_url:
behance_url:
fivehundredpx_url:
email_url:
rss_url: /atom.xml

# Footer About Text
footer_about: "A personal blog built with Hexo."

# Footer Copyright Line
footer_copyright: "&copy; 2026 Your Name. All rights reserved."

# Category Password Protection (Optional)
# Posts in listed categories will be encrypted at build time and require a password to view.
# Can also be specified in the site root _config.yml or via CATEGORY_PASSWORDS env var.
# category_password:
#   SecretCategory: "password123"


